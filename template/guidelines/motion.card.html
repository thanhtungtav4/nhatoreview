<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/css/nhato.css"><style>body{margin:0;background:var(--nh-paper);font-family:var(--font-body);padding:20px 24px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.sw i{display:block;height:52px;border:1px solid rgba(0,0,0,.08)}.sw b{display:block;font-size:11px;font-weight:600;margin-top:6px;letter-spacing:.01em}.sw s{display:block;font-size:10.5px;color:var(--nh-gray-5);text-decoration:none;font-variant-numeric:tabular-nums}</style></head><body><style>.m{width:150px;height:46px;background:var(--nh-gold);color:var(--nh-ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;animation:sl 2.4s var(--ease-standard) infinite alternate}@keyframes sl{from{transform:translateX(0)}to{transform:translateX(120px)}}</style><div class="m">ease-standard</div><div style="font-size:11px;color:var(--nh-gray-5);margin-top:12px;font-variant-numeric:tabular-nums">cubic-bezier(.2,.7,.2,1) · 180ms links & buttons · 220ms underline sweep · 500ms image zoom (scale 1.045)</div></body></html>
