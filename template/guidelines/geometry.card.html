<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--nh-paper);font-family:var(--font-body);padding:20px 24px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.sw i{display:block;height:52px;border:1px solid rgba(0,0,0,.08)}.sw b{display:block;font-size:11px;font-weight:600;margin-top:6px;letter-spacing:.01em}.sw s{display:block;font-size:10.5px;color:var(--nh-gray-5);text-decoration:none;font-variant-numeric:tabular-nums}</style></head><body><div class="g" style="align-items:flex-end"><div class="sw"><i style="height:56px;background:var(--nh-white);border:1px solid var(--nh-gray-2);border-radius:0"></i><b>none</b><s>cards, images, buttons</s></div><div class="sw"><i style="height:56px;background:var(--nh-white);border:1px solid var(--nh-gray-2);border-radius:2px"></i><b>sm — 2px</b><s>rare</s></div><div class="sw"><i style="height:56px;background:var(--nh-white);border:1px solid var(--nh-gray-2);border-radius:.45rem"></i><b>panel — .45rem</b><s>category panel</s></div><div class="sw"><i style="height:56px;background:var(--nh-gold);border-radius:1000px"></i><b>pill — 1000</b><s>chip, arrow button</s></div></div></body></html>
