<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--nh-paper);display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.dark{background:var(--nh-charcoal-deep);padding:18px}h4{font:600 10px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--nh-gray-5);margin:0 0 10px}</style></head><body>
<script src="../../assets/icons/nhato-icons.js"></script>
<div><h4>Input</h4><label class="nh-label" for="n">Họ và tên <span class="nh-label__required">*</span></label><input class="nh-field" id="n" placeholder="Nguyễn Văn A"><div style="height:12px"></div><label class="nh-label" for="m">Nội dung</label><textarea class="nh-field" id="m" rows="2" placeholder="Bạn cần NHATO hỗ trợ điều gì?"></textarea></div>
<div class="dark"><h4 style="color:var(--nh-paper-muted)">Newsletter</h4><form class="nh-newsletter" style="margin-top:0"><input type="email" placeholder="Your email address"><button class="nh-newsletter__submit" type="submit" aria-label="Đăng ký"><svg class="nh-icon"><use href="#nh-arrow-right"></use></svg></button></form><p class="nh-newsletter__status">Cảm ơn bạn đã đăng ký.</p></div>
</body></html>
